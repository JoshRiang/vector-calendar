name: Screenshots

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter --version

      - run: flutter pub get

      - run: flutter test

      - run: flutter build web --release \
          --dart-define=API_BASE=http://localhost:9473 \
          --dart-define=API_FALLBACKS= \
          --dart-define=VECTOR_READ_ONLY=false

      - run: npm init -y
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium

      - name: Shoot screenshots
        run: node scripts/shoot.js

      - name: Commit screenshots + README
        run: |
          git config user.name 'Joshua Riangkamang'
          git config user.email 'sandinya1sampai8@gmail.com'
          git add screenshots/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update screenshots + README"
            git push origin HEAD:main
          fi